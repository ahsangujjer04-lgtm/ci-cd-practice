name: Node.js Docker CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Build Docker Image

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Application Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t ci-cd-practice:latest .

      - name: Run Docker Container
        run: docker run -d --name ci-cd-test -p 3000:3000 ci-cd-practice:latest

      - name: Test Container API
        run: |
          ready=0

          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              ready=1
              break
            fi

            sleep 2
          done

          test "$ready" -eq 1

          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/health

      - name: Display Container Logs
        if: always()
        run: docker logs ci-cd-test || true