name: Docker CI Debug

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Identify Repository and Commit
        run: |
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo "Commit:"
          echo "$GITHUB_SHA"

          echo "Working directory:"
          pwd

      - name: Inspect All Repository Files
        run: |
          echo "Root directory:"
          ls -la

          echo "Workflow files:"
          find .github/workflows -maxdepth 1 -type f -print

          echo "Dockerfile search:"
          find . -type f -iname '*dockerfile*' -print

          echo "Tracked Dockerfile:"
          git ls-files | grep -i dockerfile || true

      - name: Verify Dockerfile
        run: |
          if [ ! -f ./Dockerfile ]; then
            echo "ERROR: Dockerfile is missing from repository root."
            exit 1
          fi

          echo "Dockerfile found."
          wc -c ./Dockerfile
          cat ./Dockerfile

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            --file "$GITHUB_WORKSPACE/Dockerfile" \
            --tag ci-cd-practice:latest \
            "$GITHUB_WORKSPACE"
