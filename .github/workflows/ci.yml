name: Node.js Docker CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Repository
        run: |
          echo "Working directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Dockerfile:"
          ls -l "$GITHUB_WORKSPACE/Dockerfile"
          wc -c "$GITHUB_WORKSPACE/Dockerfile"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            --file "$GITHUB_WORKSPACE/Dockerfile" \
            --tag ci-cd-practice:latest \
            "$GITHUB_WORKSPACE"

      - name: Run Docker Container
        run: |
          docker run -d \
            --name ci-cd-test \
            -p 3000:3000 \
            ci-cd-practice:latest

      - name: Test Container API
        run: |
          ready=0

          for i in {1..15}; do
            if curl --fail http://localhost:3000/health; then
              ready=1
              break
            fi

            echo "Waiting for application..."
            sleep 2
          done

          test "$ready" -eq 1

          echo "Testing homepage:"
          curl --fail http://localhost:3000/

          echo "Testing health endpoint:"
          curl --fail http://localhost:3000/health

      - name: Display Container Logs
        if: always()
        run: docker logs ci-cd-test || true

      - name: Cleanup Docker Container
        if: always()
        run: docker rm -f ci-cd-test || true
