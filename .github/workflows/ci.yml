name: Node.js Docker CI/CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    name: Test, Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            --file "$GITHUB_WORKSPACE/Dockerfile" \
            --tag ahsanalich/ci-cd-practice:latest \
            --tag ahsanalich/ci-cd-practice:${GITHUB_SHA} \
            "$GITHUB_WORKSPACE"

      - name: Run Docker Container
        run: |
          docker run -d \
            --name ci-cd-test \
            -p 3000:3000 \
            ahsanalich/ci-cd-practice:latest

      - name: Test Container API
        run: |
          ready=0

          for i in {1..15}; do
            if curl --fail http://localhost:3000/health; then
              ready=1
              break
            fi

            echo "Waiting for application..."
            sleep 2
          done

          test "$ready" -eq 1

          echo "Testing homepage:"
          curl --fail http://localhost:3000/

          echo "Testing health endpoint:"
          curl --fail http://localhost:3000/health

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ahsanalich/ci-cd-practice:latest
          docker push ahsanalich/ci-cd-practice:${GITHUB_SHA}

      - name: Display Container Logs
        if: always()
        run: docker logs ci-cd-test || true

      - name: Cleanup Docker Container
        if: always()
        run: docker rm -f ci-cd-test || true
